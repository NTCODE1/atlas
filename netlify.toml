# Netlify build + hosting config for the Atlas PWA (Vite/React).

[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path that isn't a real file falls back to index.html so
# client-side routing works on hard refresh / deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or clients get stuck on a stale build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
