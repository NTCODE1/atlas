name = "atlas-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
# The Anthropic SDK imports node built-ins (node:fs/node:path in its credential
# helpers); nodejs_compat provides them on Workers.
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Secrets (API_SECRET, ATLAS_API_KEY, ANTHROPIC_API_KEY,
# SESSION_SECRET, SETUP_CODE, and — for the Social tab's TikTok accounts —
# TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET) are set with `wrangler secret put`
# and must NOT live here.
#   SESSION_SECRET — random 32+ char string; HMAC key for passkey session tokens.
#   SETUP_CODE     — one-time code you type once per device to enroll a passkey.
# The passkey Relying Party ID/origin is derived from the request Origin and
# validated against ALLOWED_ORIGINS below — so just add your Netlify origin there.
[vars]
# Comma-separated CORS allowlist. Add your deployed (Netlify) origin here later,
# e.g. "https://your-app.netlify.app". Local Vite dev ports included for now.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175,https://atlas16474859-nt24358.netlify.app"
# Max AI (Claude) requests per UTC day, to bound abuse.
AI_DAILY_CAP = "100"

# Run `npx wrangler kv namespace create HEALTH_KV` and paste the printed id below.
[[kv_namespaces]]
binding = "HEALTH_KV"
id = "c97ba23b2ebd4775a73743b9e8654dc8"

# Structured storage for everything that used to live only in browser localStorage
# (nutrition, journal, and — over time — the rest of the domains in migrations/
# 0001_init.sql) plus health/workout ingest. See src/sync.ts. Created with
# `npx wrangler d1 create atlas-db`; migrations applied with
# `npx wrangler d1 migrations apply atlas-db` (add `--local` for local dev).
[[d1_databases]]
binding = "DB"
database_name = "atlas-db"
database_id = "74ac927c-d0ab-469b-9dbe-8bd62672b63f"
migrations_dir = "migrations"

# Cron: daily social-media follower sync (see the `scheduled` handler in
# src/index.ts + src/social.ts). 05:20 UTC daily. Cloudflare cron triggers are
# free on the Workers free plan. Test a run without waiting a day with:
#   npx wrangler dev --test-scheduled   then  curl "http://localhost:8787/__scheduled"
# or just hit POST /api/social/refresh from the app.
[triggers]
crons = ["20 5 * * *"]
